<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f2e8">
<meta name="description" content="Požádejte o registraci firmy do sítě Opravao.cz.">
<link rel="canonical" href="https://opravao.cz/registrace-firmy.html">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Registrace firmy | Opravao.cz</title>
<style>
:root{--paper:#f7f2e8;--ink:#20211f;--orange:#e94e1b;--line:#ded8cb;--muted:#77756d;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Inter,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:0 24px}header{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{font-size:27px;font-weight:950;letter-spacing:-1.2px;text-decoration:none;color:inherit}.brand i{font-style:normal;color:var(--orange)}
.back{font-weight:750;color:inherit;text-decoration:none}.back:hover{color:var(--orange)}
main{padding:38px 0 60px}.eyebrow{color:var(--orange);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin:0 0 9px}
h1{font-size:clamp(34px,6vw,52px);letter-spacing:-.045em;line-height:1.02;margin:0 0 12px}
.intro{color:var(--muted);line-height:1.55;font-size:17px;margin:0 0 22px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:clamp(20px,4vw,34px)}
#company-form{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
#company-form label{display:block;font-weight:750;margin:10px 0}
#company-form input:not([type=checkbox]),#company-form select,#company-form textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;font:inherit;margin-top:5px;background:white;color:var(--ink)}
#company-form label:has(textarea),#company-form .privacy-consent,#company-form .btn,#company-submit-status,#company-ares-status{grid-column:1/-1}
#company-form .privacy-consent{display:flex;align-items:flex-start;gap:9px;line-height:1.45;font-weight:500}
#company-form .privacy-consent input{margin-top:4px;flex:none}
#company-form .privacy-consent a{color:inherit;text-decoration:underline}
.btn{justify-self:start;border:0;border-radius:6px;padding:14px 20px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}.company-hint{font-size:13px;color:var(--muted);line-height:1.45}
#company-submit-status[data-state=success]{color:#315344}#company-submit-status[data-state=error]{color:#a12c12}
@media(max-width:620px){.wrap{padding:0 16px}header{height:66px}#company-form{grid-template-columns:1fr}#company-form>*{grid-column:1/-1}.back{font-size:14px}}
</style>
</head>
<body><div class="wrap">
<header><a class="brand" href="/">Oprava<i>o</i>.cz</a><a class="back" href="/">← Zpět na web</a></header>
<main><p class="eyebrow">Pro řemeslníky a firmy</p><h1>Požádat o registraci</h1>
<p class="intro">Vyplňte údaje firmy. Žádost odešleme k ověření; po schválení vám dáme vědět.</p>
<section class="panel" aria-label="Registrační formulář firmy"><form id="company-form"><label>IČO<input name="ico" required inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8 číslic"></label><label>Název firmy<input name="company" required maxlength="150" autocomplete="organization"></label><label>Sídlo firmy<input name="address" maxlength="250" autocomplete="street-address"></label><p id="company-ares-status" role="status" aria-live="polite" class="company-hint">Po zadání 8 číslic IČO zkusíme automaticky doplnit firmu a sídlo z ARES.</p><label>Kontaktní osoba<input name="name" required maxlength="120"></label><label>Telefon<input name="phone" type="tel" required maxlength="40"></label><label>E-mail<input name="email" type="email" required maxlength="254"></label><label>Kraj působnosti<select name="region" required><option value="">Vyberte kraj</option><option>Praha</option><option>Středočeský kraj</option><option>Jihočeský kraj</option><option>Plzeňský kraj</option><option>Karlovarský kraj</option><option>Ústecký kraj</option><option>Liberecký kraj</option><option>Královéhradecký kraj</option><option>Pardubický kraj</option><option>Kraj Vysočina</option><option>Jihomoravský kraj</option><option>Olomoucký kraj</option><option>Zlínský kraj</option><option>Moravskoslezský kraj</option></select></label><label>Obory oprav<input name="specialization" required placeholder="Např. instalatér, elektrikář" maxlength="300"></label><label>Poznámka<textarea name="note" rows="3" maxlength="1000"></textarea></label><label class="privacy-consent"><input type="checkbox" name="privacy_ack" required> Potvrzuji, že jsem se seznámil/a s <a href="/ochrana-osobnich-udaju.html" target="_blank" rel="noopener">informacemi o zpracování osobních údajů</a>.</label><button class="btn" type="submit">Odeslat žádost o registraci</button><p id="company-submit-status" class="company-hint" role="status" aria-live="polite"></p></form></section></main>
</div>
<script src="/assets/opravao-4.js"></script>
</body></html>
